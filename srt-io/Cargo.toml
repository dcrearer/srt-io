[package]
name = "srt-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust wrapper over libsrt (Secure Reliable Transport)"
readme = "../README.md"
categories = ["network-programming"]
keywords = ["srt", "libsrt", "streaming", "transport", "video"]

[dependencies]
srt-io-sys.workspace = true
thiserror.workspace = true
tracing.workspace = true
libc.workspace = true
tokio = { workspace = true, optional = true }

[features]
# Opt-in Tokio async layer. Off by default: the blocking API needs no Tokio.
tokio = ["dep:tokio"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

# Async examples require the Tokio layer; they are skipped without the feature.
[[example]]
name = "async_listener"
required-features = ["tokio"]

[[example]]
name = "async_caller"
required-features = ["tokio"]
