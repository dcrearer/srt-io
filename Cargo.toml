[workspace]
resolver = "3"
members = ["srt-sys", "srt"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "local"

[workspace.dependencies]
srt-sys = { path = "srt-sys", version = "0.1.0" }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "macros", "time"] }
tracing = "0.1"
