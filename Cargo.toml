[workspace]
resolver = "3"
members = ["srt-io-sys", "srt-io"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
srt-io-sys = { path = "srt-io-sys", version = "0.1.0" }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "macros", "time"] }
tracing = "0.1"
libc = "0.2.191"
