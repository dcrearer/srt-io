name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # --------------------------------------------------------------------------
  # Rust: fmt + clippy + test. Builds the VENDORED libsrt + mbedTLS via cmake,
  # so the C toolchain, cmake and libclang (for bindgen) must be present and
  # the build output under target/ is cached.
  # --------------------------------------------------------------------------
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install C build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev
          echo "LIBCLANG_PATH=$(llvm-config --libdir 2>/dev/null || echo /usr/lib/llvm-14/lib)" >> "$GITHUB_ENV"

      - name: Install C build dependencies (macOS)
        if: runner.os == 'macOS'
        # clang/libclang ship with the Xcode Command Line Tools; only cmake is needed.
        run: |
          brew install cmake || brew upgrade cmake

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry + target (incl. vendored cmake build output)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keep the whole target dir so the minutes-long vendored C build is reused.
          cache-all-crates: true
          key: ${{ matrix.os }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy -D warnings (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (default features)
        run: cargo test --workspace

      - name: cargo test (all features, incl. tokio async layer)
        run: cargo test --workspace --all-features

  # --------------------------------------------------------------------------
  # Dependency auditing against the RustSec Advisory Database.
  # Cargo.lock is gitignored for this library, so generate one first.
  # --------------------------------------------------------------------------
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: cargo audit
        run: cargo audit

  # --------------------------------------------------------------------------
  # ASH (Automated Security Helper) security scan.
  # --------------------------------------------------------------------------
  ash:
    name: ASH security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Submodules excluded: vendored C sources are maintained upstream and
          # are ignored via .ash/ash.yaml.
          submodules: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run ASH (local mode)
        run: uvx git+https://github.com/awslabs/automated-security-helper.git@v3 --mode local

      - name: Upload ASH results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ash-results
          path: .ash/ash_output/
          if-no-files-found: ignore
