[package]
name = "srt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Safe Rust wrapper over libsrt (Secure Reliable Transport)"

[dependencies]
srt-sys.workspace = true
thiserror.workspace = true
tracing.workspace = true
libc.workspace = true
tokio = { workspace = true, optional = true }

[features]
# Opt-in Tokio async layer. Off by default: the blocking API needs no Tokio.
tokio = ["dep:tokio"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
